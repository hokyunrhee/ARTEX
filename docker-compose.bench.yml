# ARTEX Tencent TSec Benchmark image: build and run locally.
# Independent of the production docker-compose.yml (artex and postgres services).
# Usage (currently unavailable: Dockerfile.bench and bench/.env are absent from this repository):
#   cp bench/.env.example bench/.env   # Set LLM_API_KEY, BENCHMARK_TOKEN, and other values.
#   docker compose -f docker-compose.bench.yml up --build      # Build and run in the foreground.
#   docker compose -f docker-compose.bench.yml up --build -d   # Run in the background.
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # Stop; add -v to remove volumes.
# Open http://localhost:8787 and sign in with ADMIN_PASSWORD.

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # Share the host network stack to reach target machines on the host or VPN network.
    # Host networking needs no port mappings: the container binds host ports 8787 (UI/API),
    # 8788 (proxy), and 5432 (internal PostgreSQL). Stop conflicting services before local tests.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
